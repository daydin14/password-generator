<!doctype html>
<html lang="en" data-theme="cipher">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate a cryptographically secure password and optionally split it into dash-separated groups."
    />
    <meta name="theme-color" content="#12141c" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Dave's Password Generator</title>
    <script>
      (function () {
        var storageKey = 'pg-theme'
        var dark = 'cipher'
        var light = 'cipher-light'
        var theme = dark
        try {
          var stored = localStorage.getItem(storageKey)
          if (stored === dark || stored === light) {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = light
          }
        } catch (error) {
          theme = dark
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme === light ? 'light' : 'dark'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === light ? '#f4f1eb' : '#12141c')
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
